name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'virtual-tour-web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pillow boto3

      - name: Validate manifest
        run: python scripts/validate_manifest.py

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'virtual-tour-web'

      - name: Install dependencies
        working-directory: virtual-tour-web
        run: npm ci

      - name: Secret scan
        run: |
          if grep -r "pk\.eyJ" virtual-tour-web/src/; then
            echo "FAIL: Mapbox token found in source"
            exit 1
          fi
          if grep -r "eyJhbGci" virtual-tour-web/src/; then
            echo "FAIL: Supabase key found in source"
            exit 1
          fi
          echo "Secret scan passed"

      - name: Build
        working-directory: virtual-tour-web
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: virtual-tour-web/dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          project-name: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
          directory: dist
          # Optional: branch controls which branch deploys to preview/production
          # branch: ${{ github.ref_name == 'main' && 'production' || 'preview' }}

  post-deploy:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Smoke test live URL
        run: |
          DEPLOY_URL="https://virtual-360.pages.dev"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_URL")
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: Live URL returned $STATUS"
            exit 1
          fi
          echo "PASS: Live URL returned 200"

      - name: Check tour API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/tours?slug=eq.kon-tum-forest&select=id,name,status")
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: Supabase API returned $STATUS"
            exit 1
          fi
          echo "PASS: Tour API reachable"